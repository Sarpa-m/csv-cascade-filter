name: PR Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Conventional Commits regex
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_-]+\))?!?: .+'
          if ! echo "$TITLE" | grep -qE "$PATTERN"; then
            echo "❌ PR title does not follow Conventional Commits format."
            echo ""
            echo "Expected format: <type>[scope]: <description>"
            echo "Examples:"
            echo "  feat(cascade): adiciona avanço automático"
            echo "  fix(parser): trata aspas escapadas em campos CSV"
            echo "  chore: atualiza dependências"
            echo ""
            echo "Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi
          echo "✅ PR title is valid: $TITLE"
