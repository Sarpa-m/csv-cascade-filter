name: PR Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_-]+\))?!?: .+'
          if ! echo "$TITLE" | grep -qE "$PATTERN"; then
            echo "❌ PR title does not follow Conventional Commits format."
            echo ""
            echo "Expected: <type>[scope]: <description>"
            echo "Examples:"
            echo "  feat(cascade): adiciona avanço automático"
            echo "  fix(parser): trata aspas escapadas"
            echo "  chore: atualiza dependências"
            exit 1
          fi
          echo "✅ PR title valid: $TITLE"
