name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Bump version on tag push ──────────────────────────────────────────
  # Atualiza version.ts e README diretamente na main ANTES do build,
  # para que o source code do release já tenha a versão correta.
  bump:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Update version in source
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          echo "🏷️  Bumping source to $VER"
          sed -i "s/export const APP_VERSION = '[^']*';/export const APP_VERSION = '$VER';/" src/lib/version.ts
          sed -i "s/vers%C3%A3o-v[0-9.]*-/vers%C3%A3o-v${VER}-/" README.md

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/version.ts README.md
          git diff --staged --quiet || (
            git commit -m "chore: bump version to $VER"
            git push origin main
          )

  # ── Tests ─────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: pnpm test

  # ── Bundle ────────────────────────────────────────────────────────────
  bundle:
    needs: [bump, test]
    if: |
      always() &&
      (needs.test.result == 'success') &&
      (needs.bump.result == 'success' || needs.bump.result == 'skipped' || needs.bump.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Generate bundle
        run: >-
          pnpm bundle ${{ github.ref_type == 'tag' && format('-- --version {0}', github.ref_name) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: csv-cascade-filter.html
          if-no-files-found: error
          retention-days: 30

  # ── Release ───────────────────────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: csv-cascade-filter.html
          generate_release_notes: true
