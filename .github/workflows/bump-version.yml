name: Bump version after release

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Get release version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VER="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Update APP_VERSION in version.ts
        run: |
          sed -i "s/export const APP_VERSION = '[^']*';/export const APP_VERSION = '${{ steps.version.outputs.version }}';/" src/lib/version.ts

      - name: Update version badge in README
        run: |
          VER="${{ steps.version.outputs.version }}"
          sed -i "s/!\[Version\](https:\/\/img\.shields\.io\/badge\/vers%C3%A3o-[^-]*-/![Version](https:\/\/img\.shields\.io\/badge\/vers%C3%A3o-v${VER}-/" README.md 2>/dev/null || true
          sed -i "s/\[v[0-9.]*\](https:\/\/github\.com\/Sarpa-m\/csv-cascade-filter\/releases)/[v${VER}](https:\/\/github\.com\/Sarpa-m\/csv-cascade-filter\/releases)/" README.md

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/bump-${{ steps.version.outputs.tag }}
          commit-message: "chore: bump version to ${{ steps.version.outputs.version }}"
          title: "chore: bump version to ${{ steps.version.outputs.version }}"
          body: |
            Atualização automática pós-release ${{ steps.version.outputs.tag }}.

            - `APP_VERSION` em `src/lib/version.ts` → `${{ steps.version.outputs.version }}`
            - Badge e link no `README.md`
          labels: chore
          delete-branch: true
